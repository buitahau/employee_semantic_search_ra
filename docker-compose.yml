services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: owt-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: owt_employee
    ports:
      - "5432:5432"
    volumes:
      - owt_pg_data:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  owt_pg_data: